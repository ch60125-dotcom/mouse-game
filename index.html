<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電腦王國大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#22223b;--paper:#fffbea;--gold:#ffc93c;--red:#ef476f;--green:#06d6a0;--blue:#118ab2;--purple:#9b5de5;--sky:#caf0f8}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:#1d2145;background-image:radial-gradient(circle at 15% 0%,#3a4190 0,transparent 55%),radial-gradient(circle at 90% 100%,#4b2a6b 0,transparent 50%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none}
#app{max-width:1000px;margin:0 auto;padding:12px}
.px{font-family:'Press Start 2P',monospace;font-size:11px}
#hud{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:0 6px 0 #0007;margin-bottom:14px;min-height:56px}
#hud:empty{display:none}
.stat{display:flex;align-items:center;gap:6px;font-weight:900}
.meter{width:120px;height:14px;background:#e9e3cf;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--green);transition:width .3s}
.meter.exp>i{background:var(--gold)}
.meter.foehp{width:100%;height:20px}
.meter.foehp>i{background:var(--red)}
.meter.atk{width:100%;height:8px;border-width:2px}
.meter.atk>i{background:var(--purple);transition:none}
#main{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:18px;min-height:580px;padding:16px;box-shadow:0 8px 0 #0007;overflow:hidden}
h1,h2,h3{margin:.2em 0}
.btn{font:inherit;font-weight:900;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .05s,filter .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:14px;padding:5px 10px;box-shadow:0 3px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.g{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar h2{flex:1}
.center{text-align:center}
.tip{color:#666;font-size:14px;margin-top:8px}
input.tin{font:inherit;font-size:30px;font-weight:700;padding:10px 14px;border:4px solid var(--ink);border-radius:12px;width:min(460px,90%);text-align:center;background:#fff;outline:none;user-select:text;-webkit-user-select:text}
input.tin:focus{border-color:var(--blue);box-shadow:0 0 0 4px #118ab233}
input.tin.ok{border-color:var(--green);background:#e6fff6}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{50%{opacity:0}}
@keyframes lunge{0%,100%{transform:scale(1)}40%{transform:scale(1.5) translateY(20px)}}
@keyframes popup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes flashred{0%{box-shadow:inset 0 0 0 0 #ef476f00}30%{box-shadow:inset 0 0 0 14px #ef476faa}100%{box-shadow:inset 0 0 0 0 #ef476f00}}
.hurt{animation:flashred .4s}
/* title */
.title{text-align:center;padding:30px 10px}
.title .logo{width:150px;height:150px;margin:0 auto;animation:bob 2s infinite}
/* art */
.sv{width:100%;height:100%;display:block;overflow:visible}
.ic{width:1.6em;height:1.6em;display:inline-block;vertical-align:middle;overflow:visible}
.hc{width:22px;height:22px;display:inline-block;vertical-align:middle}
.eye{transform-box:fill-box;transform-origin:center;animation:blinkEye 4.5s infinite}
@keyframes blinkEye{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.aura{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.4}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.float{animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.drift{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.spark{position:absolute;width:14px;height:14px;pointer-events:none;z-index:40;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:250;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes hitfx{0%{transform:translateX(0);filter:brightness(2.4)}25%{transform:translateX(-10px)}60%{transform:translateX(8px);filter:brightness(1.4)}100%{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.eye,.aura,.spin,.bob,.float,.drift,.title .logo,.foe .m{animation:none!important}}
.title h1{font-size:46px;font-weight:900;letter-spacing:4px;color:var(--ink);text-shadow:4px 4px 0 var(--gold)}
.title .sub{font-size:18px;color:#555;margin-bottom:24px}
/* map */
.map{position:relative;height:520px;border-radius:14px;border:3px solid var(--ink);overflow:hidden;background:#95d5b2}
.map>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;border:none;background:none;font:inherit;padding:0}
.node .ico{width:86px;height:86px;display:block;margin:0 auto;filter:drop-shadow(0 5px 0 #0004);transition:transform .15s}
.node:hover .ico{transform:scale(1.15) translateY(-5px)}
.node .lbl{display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:900;white-space:nowrap}
.node.locked .ico{filter:grayscale(1) brightness(.75) drop-shadow(0 5px 0 #0005)}
.node.done .lbl{background:var(--green)}
.node .tipx{display:none;position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap;z-index:5}
.node:hover .tipx{display:block}
/* battle v2 */
.stage{position:relative;height:310px;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:62px;background:#0000001f;border-top:3px solid #00000022;z-index:0}
.side{position:absolute;top:10px;width:40%;background:#fffffff0;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;z-index:3;font-size:14px}
.side.left{left:10px}.side.right{right:10px}
.side .nm{font-weight:900;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .lab{font-size:11px;color:#555;margin-top:4px}
.side .meter{width:100%}
.meter.mp>i{background:var(--blue)}
.fighter{position:absolute;bottom:20px;width:150px;height:150px;z-index:2}
.fighter.hero{left:10%}
.fighter.enemy{right:10%;width:175px;height:175px;animation:bob 2.6s ease-in-out infinite}
.hero.lunge .sv{animation:heroLunge .42s}
@keyframes heroLunge{40%{transform:translateX(70px) scale(1.08)}}
.hero.hurt .sv{animation:hitfx .36s}
.hero.charged .sv{filter:drop-shadow(0 0 10px #ffc93c) drop-shadow(0 0 4px #ffc93c)}
.stage.hit .enemy .sv{animation:hitfx .36s}
.stage.atk .enemy .sv{animation:enemyLunge .5s}
@keyframes enemyLunge{40%{transform:translateX(-80px) scale(1.15)}}
.enemy.rage .sv{filter:drop-shadow(0 0 14px #ef476f) saturate(1.6)}
.enemy.ko .sv{animation:ko .7s forwards}
@keyframes ko{to{transform:translateY(30px) rotate(25deg) scale(.6);opacity:0}}
.stage.quake{animation:shake .3s 2}
.shieldfx{position:absolute;inset:-12px;border-radius:50%;border:4px solid #4cc9f0;background:#4cc9f02e;box-shadow:0 0 18px #4cc9f0;opacity:0;transition:opacity .3s;pointer-events:none}
.shieldfx.on{opacity:1}
.combo{position:absolute;left:50%;top:112px;transform:translateX(-50%);font-weight:900;font-size:30px;color:#ffc93c;text-shadow:2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);z-index:4;white-space:nowrap}
.combo.bump{animation:spawn .26s}
.say{position:absolute;right:12%;top:104px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:900;z-index:5;opacity:0;transition:opacity .25s;max-width:60%}
.say.on{opacity:1}
.sbtns{position:absolute;right:10px;bottom:8px;display:flex;gap:6px;z-index:4}
.shot{position:absolute;width:40px;height:40px;z-index:5;pointer-events:none;transition:left .32s ease-in,top .32s ease-in}
.skills{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.skill{background:#fff}
.skill small{background:var(--blue);color:#fff;border-radius:6px;padding:0 5px;margin-left:6px;font-size:11px}
.skill.ready{background:var(--gold)}
.skill.locked{opacity:.4}
.opts .btn.gone{visibility:hidden}
.kh{font-weight:700;color:var(--purple);min-height:22px;font-size:15px}
.msgcard{max-width:560px;margin:4px auto 16px;text-align:left;background:#f1f3f5;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.msgcard .mh{background:var(--ink);color:#fff;padding:6px 12px;font-size:14px}
.msgcard .mb{padding:14px;font-size:20px;font-weight:700;line-height:1.6}
.opts .btn.safe{background:#d8f3dc}.opts .btn.danger{background:#ffe0e6}
.starrow{font-size:44px;letter-spacing:6px;line-height:1}
.starrow span{color:#dee2e6;display:inline-block;-webkit-text-stroke:2px var(--ink)}
.starrow span.on{color:var(--gold);animation:spawn .35s both}
.rstat{font-size:15px;margin-top:6px}
.newbest{color:var(--red);font-weight:900;margin:4px 0}
.nst{display:block;font-size:12px;color:#e09f3e;letter-spacing:1px;line-height:1}
.hhead{display:inline-block;width:30px;height:30px;vertical-align:middle}
.heroes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.hpick{width:96px;border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;padding:6px 4px;font:inherit;box-shadow:0 3px 0 var(--ink)}
.hpick .sv{width:80px;height:80px;margin:0 auto}
.hpick.sel{background:var(--gold);transform:translateY(-3px)}
@media (max-width:640px){.fighter{width:96px;height:96px}.fighter.enemy{width:110px;height:110px}.side{width:46%;font-size:12px}.stage{height:270px}.combo{top:96px;font-size:22px}}
.topbar{flex-wrap:wrap}
.daily{margin-top:12px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 14px}
.dq{display:grid;gap:6px;margin-top:8px}
.dqi{display:grid;grid-template-columns:1fr 130px 44px;gap:10px;align-items:center;font-weight:700}
.dqi .meter{width:100%}
.dqi small{text-align:right;color:#666}
.dqi.done span{color:#2d6a4f;text-decoration:line-through}
.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ccard{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px;text-align:center;box-shadow:0 3px 0 var(--ink);min-height:120px;animation:spawn .25s}
.ccard.lock{background:#e9ecef;color:#999;display:flex;flex-direction:column;justify-content:center;box-shadow:none;border-style:dashed}
.ccard .cq{font-size:40px;font-weight:900}
.ccard .ct{font-weight:900;text-align:left;font-size:14px;line-height:1.5}
.ccard .ca{font-weight:900;color:var(--blue);margin:6px 0}
.ccard .ca.ok{color:#2d6a4f}.ccard .ca.bad{color:var(--red)}
.ccard .cm{font-size:13px;text-align:left;background:#f1f3f5;border-radius:8px;padding:4px 6px;margin:6px 0;line-height:1.5}
.ccard .cw{font-size:30px;font-weight:900;letter-spacing:3px;margin-top:10px}
.ccard .czy{color:var(--blue);font-weight:700;letter-spacing:2px}
.ccard small{color:#666;display:block;font-size:12px;line-height:1.5}
.towerbox{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.towerart{width:130px;height:130px;flex:none;animation:bob 2.6s ease-in-out infinite}
.trules{margin:6px 0;padding-left:20px;line-height:1.8}
.cps{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:640px){.dqi{grid-template-columns:1fr 70px 36px;font-size:14px}.towerbox{flex-direction:column}}
.tpanel{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#e8dcf7;border:3px solid var(--purple);border-radius:12px;padding:10px 14px}
.hint{margin-top:12px;background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}
/* dialog */
.scene{position:relative;height:540px;border-radius:14px;border:3px solid var(--ink);overflow:hidden}
.scene>svg{display:block;width:100%;height:100%}
.dlg{position:absolute;left:24px;right:24px;bottom:24px;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:14px 16px 26px 100px;min-height:120px;cursor:pointer;z-index:50;box-shadow:0 6px 0 #0005}
.dlg .face{position:absolute;left:12px;top:10px;width:76px;height:76px}
.dlg .who{font-weight:900;color:var(--blue)}
.dlg .txt{font-size:20px;line-height:1.6}
.dlg .nx{position:absolute;right:16px;bottom:6px;font-size:13px;color:#888;animation:blink 1s infinite}
/* battle */
.foe{position:relative;display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 16px}
.foe .m{width:120px;height:120px;flex:none;animation:bob 2.6s ease-in-out infinite}
.foe .info{flex:1;background:#fffc;border-radius:10px;padding:6px 10px}
.foe.hit .m{animation:hitfx .35s}
.foe.atk .m{animation:lunge .45s}
#challenge{margin-top:14px;min-height:330px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:18px;text-align:center;position:relative}
.zy{font-size:22px;color:var(--blue);letter-spacing:3px;font-weight:700}
.word{font-size:58px;font-weight:900;letter-spacing:8px;margin:4px 0 14px}
.q{font-size:24px;font-weight:900;margin:6px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:680px;margin:0 auto}
.opts .btn{background:#fff;font-size:19px}
.opts .btn.right{background:var(--green)}
.opts .btn.wrong{background:var(--red);color:#fff}
.expl{margin-top:14px;font-weight:700;color:var(--blue);min-height:26px}
.keycap{display:inline-block;border:3px solid var(--ink);border-bottom-width:6px;border-radius:8px;padding:4px 12px;background:#fff;font-weight:900;margin:0 3px}
.pop{position:absolute;font-weight:900;font-size:26px;color:var(--red);pointer-events:none;animation:popup .8s forwards;text-shadow:2px 2px 0 #fff;z-index:30;transform:translate(-50%,0)}
/* arena */
.arena{position:relative;height:400px;border:3px solid var(--ink);border-radius:14px;margin-top:12px;overflow:hidden;background:radial-gradient(circle at 30% 30%,#d8f3dc,#95d5b2 60%,#74c69d);cursor:crosshair}
.mini-arena{position:relative;height:260px;border:3px solid var(--ink);border-radius:12px;background:#d8f3dc;overflow:hidden}
.bug{position:absolute;width:60px;height:60px;cursor:pointer;animation:spawn .2s;touch-action:none;z-index:2}
.bug:hover{transform:scale(1.15)}
.bug .sv{pointer-events:none}
.bug.gem{filter:drop-shadow(0 0 8px #fff)}
.bug .tag{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 5px;font-size:11px;font-weight:900;white-space:nowrap;pointer-events:none}
.arenabg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.legend .ic{width:26px;height:26px}
.hint .sv{width:38px;height:38px;display:inline-block;vertical-align:middle}
.modal .big .sv{width:110px;height:110px;margin:0 auto;animation:spawn .4s}
.bag{position:absolute;right:12px;bottom:12px;width:96px;height:96px;border:3px dashed var(--ink);border-radius:16px;background:#fff8;display:flex;align-items:center;justify-content:center;z-index:1}
.bag .sv{width:76px;height:76px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.legend span{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-weight:700}
.dragging{opacity:.9;transform:scale(1.15);cursor:grabbing}
/* keyboard */
.kb{display:inline-block;margin-top:14px}
.kr{display:flex;gap:5px;margin-bottom:5px}
.kr:nth-child(2){margin-left:20px}.kr:nth-child(3){margin-left:34px}.kr:nth-child(4){margin-left:54px}
.key{width:50px;height:54px;border:2px solid var(--ink);border-bottom-width:5px;border-radius:8px;background:#fff;position:relative;transition:background .1s}
.key b{position:absolute;left:5px;top:2px;font-size:11px;color:#888}
.key span{position:absolute;right:6px;bottom:3px;font-size:22px;font-weight:900}
.key.hl{background:var(--gold)}
.key.ok{background:var(--green)}
.key.no{background:var(--red)}
.target{font-size:110px;font-weight:900;color:var(--blue);line-height:1.1}
/* arcade */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.gcard{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.gcard:hover{transform:translateY(-4px)}
.gcard .e{width:100%;height:110px;border:3px solid var(--ink);border-radius:10px;padding:8px;margin-bottom:8px;display:flex;justify-content:center}
.gcard .e .sv{width:94px;height:94px;transition:transform .2s}
.gcard:hover .e .sv{transform:scale(1.1) rotate(-4deg)}
.gcard h3{font-size:20px}
.gcard p{margin:4px 0;color:#555;font-size:14px}
.folders{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.folder{border:3px solid var(--ink);border-radius:14px;background:#ffe8a3;min-height:130px;text-align:center;padding:8px;transition:transform .1s}
.folder .fi{width:70px;height:70px;margin:0 auto}
.folder .fn{font-weight:900}
.folder .cnt{font-size:13px;color:#555}
.folder.flash{background:var(--green)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:100px;border:3px dashed #aaa;border-radius:14px;padding:12px;background:#fff}
.file{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;text-align:center;cursor:grab;width:110px;touch-action:none}
.file .fe{width:40px;height:40px;margin:0 auto;pointer-events:none}
.file .nm{font-weight:700;font-size:15px;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:620px;margin:10px auto}
.mc{height:100px;border:3px solid var(--ink);border-radius:12px;background:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff;box-shadow:0 4px 0 var(--ink)}
.mc:not(.up){background:repeating-linear-gradient(45deg,#118ab2 0 10px,#1597c2 10px 20px)}
.mc .sv{width:72px;height:72px}
.mc.up{background:#fff;color:var(--ink)}
.mc.up.txt{font-size:24px}
.mc.got{background:var(--green);cursor:default}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.item{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;text-align:center}
.item .e{width:90px;height:90px;margin:0 auto;transition:transform .2s}
.item:hover .e{transform:translateY(-4px) rotate(-5deg)}
.keeper{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.keeper .kp{width:96px;height:96px;flex:none;animation:bob 2.6s ease-in-out infinite}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;line-height:1.6}
.bubble::before{content:'';position:absolute;left:-14px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:12px solid var(--ink);border-left:0}
/* modal & toast */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:22px 26px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 0 #0008;animation:spawn .2s}
.modal .big{font-size:70px}
.modal p{font-size:17px;line-height:1.6}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;font-weight:700;padding:8px 16px;border-radius:12px;animation:spawn .15s}
.cert{border:10px double var(--gold);border-radius:16px;padding:30px;background:#fff;text-align:center;max-width:640px;margin:10px auto}
.cert h1{font-size:40px;letter-spacing:6px}
.cheat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;font-size:14px}
.cheat span{background:#f1f1f1;border-radius:8px;padding:3px 8px}
@media (max-width:640px){.opts{grid-template-columns:1fr}.word{font-size:40px}.folders{grid-template-columns:repeat(2,1fr)}.key{width:30px;height:40px}.key span{font-size:15px}.title h1{font-size:32px}}

let syncT=null,syncLogs=[],syncBusy=false,dirty=false,syncState='ok';
async function api(body){const r=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});return r.json()}
function cloudSave(log){if(!ACC)return;dirty=true;if(log)syncLogs.push(log);setCloud('wait');clearTimeout(syncT);syncT=setTimeout(flush,syncLogs.length?300:2000)}

let busy=false; // 戰鬥或計時小遊戲進行中（休息提醒會等到結束才跳出）
function go(fn){gen++;clearTimers();keyHandler=null;busy=false;main.innerHTML='';main.className='';fn();hud();window.scrollTo({top:0})}

/* ---------- 音效 ---------- */
let AC=null;
function beep(f=600,d=.08,type='square',v=.05){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.stop(AC.currentTime+d+.03)}catch(e){}}
const sfx={good:()=>{beep(660);setTimeout(()=>beep(990),70)},bad:()=>beep(150,.22,'sawtooth',.06),hit:()=>beep(320,.06),click:()=>beep(880,.03,'triangle'),win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*120)),up:()=>[392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.1,'triangle',.07),i*80))};

/* ---------- 拖曳工具（滑鼠 / 觸控皆可） ---------- */
function makeDrag(el,onDrop){
 el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();
  const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,orig=el.style.cssText;
  el.dataset.drag='1';el.classList.add('dragging');
  Object.assign(el.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',zIndex:999,pointerEvents:'none',margin:0});
  const mv=ev=>{el.style.left=ev.clientX-ox+'px';el.style.top=ev.clientY-oy+'px'};
  // 放開滑鼠＝正常放下；pointercancel／視窗失焦＝拖曳被中斷，物品放回原位
  const end=(ev,cancel)=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cc);window.removeEventListener('blur',cc);
   const t=cancel?null:document.elementFromPoint(ev.clientX,ev.clientY);el.style.cssText=orig;el.classList.remove('dragging');delete el.dataset.drag;onDrop(t,el)};
  const up=ev=>end(ev,false),cc=ev=>end(ev,true);
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cc);window.addEventListener('blur',cc)})}

 const shoot=(from,to,art,cb)=>{const s=document.createElement('div');s.className='shot';s.innerHTML=ch(art);const p=rel(from),q=rel(to);s.style.left=p.x-20+'px';s.style.top=p.y-20+'px';st.appendChild(s);

function zhuyinKeys(){

 const info=$('#info'),tg=$('#tg');const K=c=>main.querySelector(`.key[data-c="${c}"]`);
 $('#hint').onchange=e=>{hint=e.target.checked;mark()};
 const mark=()=>{main.querySelectorAll('.key.hl').forEach(k=>k.classList.remove('hl'));if(hint&&cur)K(cur).classList.add('hl')};
 const nextK=()=>{let n;do{n=pool[rnd(pool.length)]}while(n===cur);cur=n;tg.textContent=ZY[cur];mark()};
 const flash=(c,cl)=>{const k=K(c);if(!k)return;k.classList.add(cl);setTimeout(()=>k.classList.remove(cl),180)};
 $('#go').onclick=e=>{if(started)return;started=true;busy=true;e.target.remove();if(document.activeElement)document.activeElement.blur();nextK();info.textContent=`${time}s  ${score}分`;
  every(()=>{time--;info.textContent=`${time}s  ${score}分`;if(time<=0){clearTimers();keyHandler=null;reward(Math.min(40,score*2),Math.min(30,score),`答對 ${score} 個、按錯 ${miss} 次`,zhuyinKeys)}},1000);
  keyHandler=ev=>{if(ev.repeat||ev.ctrlKey||ev.metaKey||ev.altKey)return;if(!(ev.code in ZY))return;ev.preventDefault();
   if(ev.code===cur){score++;sfx.hit();flash(ev.code,'ok');nextK()}else{miss++;sfx.bad();flash(ev.code,'no')}info.textContent=`${time}s  ${score}分`}}}

function towerFloor(){const f=towerRun.floor,e=towerFoe(f),lv=f<4?'easy':f<9?'mid':'hard';
 const kinds=['quiz','type','sc'];if(f>=3)kinds.push('safe');if(f>=5)kinds.push('click');
 battle({name:`${f}F ${e.n}`,area:'Bug 無盡塔',art:e.art,bg:TOWER_BG[Math.floor((f-1)/5)%TOWER_BG.length],rage:e.boss?'不准你再往上爬！':null,
  hp:Math.round((e.boss?150:80)+f*14),atkEvery:Math.max(8000,22000-f*700),atkDmg:8+Math.floor(f/2),missDmg:5+Math.floor(f/3),
  next:(c,done)=>{const k=kinds[rnd(kinds.length)];if(k==='quiz')runQuiz(pickQuiz(),c,done);else if(k==='type')runTyping(pickWord(lv),c,done);else if(k==='sc')runShortcut(SHORTCUTS[rnd(SHORTCUTS.length)],c,done);else if(k==='safe')runSafety(pickSafety(),c,done);else runClick(c,done)},
  onWin:towerWin,onFlee:()=>{towerEnd('逃跑');go(mapScreen)}})}
function towerWin(){const f=towerRun.floor,boss=f%5===0,c=10+f*2+(boss?30:0),x=10+f*3+(boss?30:0);
 towerRun.cleared=f;const nb=f>(S.tower.best||0);if(nb)S.tower.best=f;
 S.coins+=c;S.hp=Math.min(S.maxHp,S.hp+20);quest('tower');gainExp(x);save();hud();sfx.win();if(boss||nb)confetti();
 showModal(`<div class="big">${ch('tower')}</div><h2>第 ${f} 層突破！</h2>${nb?'<p class="newbest">🎉 新的最高紀錄！</p>':''}<p>${COIN} +${c}　⭐ +${x}　❤️ +20<br>目前 HP：<b>${S.hp}/${S.maxHp}</b>　藥水：${S.potions} 瓶</p>${(f+1)%5===0?'<p><b>⚠️ 下一層是「魔王分身」！</b>記得先喝藥水補血。</p>':''}`,
  [{t:`⬆ 挑戰第 ${f+1} 層`,c:'g',f:()=>{towerRun.floor=f+1;go(towerFloor)}},{t:'🏠 結束挑戰',c:'alt',f:()=>{towerEnd('結束');go(mapScreen)}}])}
function towerEnd(how){const r=towerRun;if(!r)return null;towerRun=null;
 logRec('Bug 無盡塔','挑戰結束',`${how}：從第 ${r.start} 層出發，突破到第 ${r.cleared} 層（最高紀錄 ${S.tower.best||0} 層）`);save();return r}

/* ---------- 休息提醒：連續玩 30 分鐘，貓頭鷹老師提醒休息 ---------- */
let playSec=0;
setInterval(()=>{if(document.visibilityState==='visible'&&S.name)playSec+=15;
 if(playSec>=1800&&!busy&&!document.querySelector('.ov')){playSec=0;showModal(`<div class="big">${OWL}</div><h2>休息一下吧！</h2><p>你已經連續玩 30 分鐘囉！<br>看看窗外遠方 20 秒、伸伸懶腰，<br>讓眼睛休息一下再回來～</p>`,[{t:'好，我休息一下',c:'g'}])}},15000);

/* ---------- 啟動 ---------- */
go(titleScreen);
</script>
