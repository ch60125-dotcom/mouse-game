<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電腦王國大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#22223b;--paper:#fffbea;--gold:#ffc93c;--red:#ef476f;--green:#06d6a0;--blue:#118ab2;--purple:#9b5de5;--sky:#caf0f8}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:#1d2145;background-image:radial-gradient(circle at 15% 0%,#3a4190 0,transparent 55%),radial-gradient(circle at 90% 100%,#4b2a6b 0,transparent 50%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none}
#app{max-width:1000px;margin:0 auto;padding:12px}
.px{font-family:'Press Start 2P',monospace;font-size:11px}
#hud{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:0 6px 0 #0007;margin-bottom:14px;min-height:56px}
#hud:empty{display:none}
.stat{display:flex;align-items:center;gap:6px;font-weight:900}
.meter{width:120px;height:14px;background:#e9e3cf;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--green);transition:width .3s}
.meter.exp>i{background:var(--gold)}
.meter.foehp{width:100%;height:20px}
.meter.foehp>i{background:var(--red)}
.meter.atk{width:100%;height:8px;border-width:2px}
.meter.atk>i{background:var(--purple);transition:none}
#main{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:18px;min-height:580px;padding:16px;box-shadow:0 8px 0 #0007;overflow:hidden}
h1,h2,h3{margin:.2em 0}
.btn{font:inherit;font-weight:900;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .05s,filter .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:14px;padding:5px 10px;box-shadow:0 3px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.g{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar h2{flex:1}
.center{text-align:center}
.tip{color:#666;font-size:14px;margin-top:8px}
input.tin{font:inherit;font-size:30px;font-weight:700;padding:10px 14px;border:4px solid var(--ink);border-radius:12px;width:min(460px,90%);text-align:center;background:#fff;outline:none;user-select:text;-webkit-user-select:text}
input.tin:focus{border-color:var(--blue);box-shadow:0 0 0 4px #118ab233}
input.tin.ok{border-color:var(--green);background:#e6fff6}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{50%{opacity:0}}
@keyframes lunge{0%,100%{transform:scale(1)}40%{transform:scale(1.5) translateY(20px)}}
@keyframes popup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes flashred{0%{box-shadow:inset 0 0 0 0 #ef476f00}30%{box-shadow:inset 0 0 0 14px #ef476faa}100%{box-shadow:inset 0 0 0 0 #ef476f00}}
.hurt{animation:flashred .4s}
/* title */
.title{text-align:center;padding:30px 10px}
.title .logo{width:150px;height:150px;margin:0 auto;animation:bob 2s infinite}
/* art */
.sv{width:100%;height:100%;display:block;overflow:visible}
.ic{width:1.6em;height:1.6em;display:inline-block;vertical-align:middle;overflow:visible}
.hc{width:22px;height:22px;display:inline-block;vertical-align:middle}
.eye{transform-box:fill-box;transform-origin:center;animation:blinkEye 4.5s infinite}
@keyframes blinkEye{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.aura{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);opacity:.4}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.float{animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.drift{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.spark{position:absolute;width:14px;height:14px;pointer-events:none;z-index:40;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(200deg) scale(.3);opacity:0}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:250;pointer-events:none;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes hitfx{0%{transform:translateX(0);filter:brightness(2.4)}25%{transform:translateX(-10px)}60%{transform:translateX(8px);filter:brightness(1.4)}100%{transform:none;filter:none}}
@media (prefers-reduced-motion:reduce){.eye,.aura,.spin,.bob,.float,.drift,.title .logo,.foe .m{animation:none!important}}
.title h1{font-size:46px;font-weight:900;letter-spacing:4px;color:var(--ink);text-shadow:4px 4px 0 var(--gold)}
.title .sub{font-size:18px;color:#555;margin-bottom:24px}
/* map */
.map{position:relative;height:520px;border-radius:14px;border:3px solid var(--ink);overflow:hidden;background:#95d5b2}
.map>svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;border:none;background:none;font:inherit;padding:0}
.node .ico{width:86px;height:86px;display:block;margin:0 auto;filter:drop-shadow(0 5px 0 #0004);transition:transform .15s}
.node:hover .ico{transform:scale(1.15) translateY(-5px)}
.node .lbl{display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:900;white-space:nowrap}
.node.locked .ico{filter:grayscale(1) brightness(.75) drop-shadow(0 5px 0 #0005)}
.node.done .lbl{background:var(--green)}
.node .tipx{display:none;position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap;z-index:5}
.node:hover .tipx{display:block}
/* battle v2 */
.stage{position:relative;height:310px;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.stage::after{content:'';position:absolute;left:0;right:0;bottom:0;height:62px;background:#0000001f;border-top:3px solid #00000022;z-index:0}
.side{position:absolute;top:10px;width:40%;background:#fffffff0;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;z-index:3;font-size:14px}
.side.left{left:10px}.side.right{right:10px}
.side .nm{font-weight:900;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .lab{font-size:11px;color:#555;margin-top:4px}
.side .meter{width:100%}
.meter.mp>i{background:var(--blue)}
.fighter{position:absolute;bottom:20px;width:150px;height:150px;z-index:2}
.fighter.hero{left:10%}
.fighter.enemy{right:10%;width:175px;height:175px;animation:bob 2.6s ease-in-out infinite}
.hero.lunge .sv{animation:heroLunge .42s}
@keyframes heroLunge{40%{transform:translateX(70px) scale(1.08)}}
.hero.hurt .sv{animation:hitfx .36s}
.hero.charged .sv{filter:drop-shadow(0 0 10px #ffc93c) drop-shadow(0 0 4px #ffc93c)}
.stage.hit .enemy .sv{animation:hitfx .36s}
.stage.atk .enemy .sv{animation:enemyLunge .5s}
@keyframes enemyLunge{40%{transform:translateX(-80px) scale(1.15)}}
.enemy.rage .sv{filter:drop-shadow(0 0 14px #ef476f) saturate(1.6)}
.enemy.ko .sv{animation:ko .7s forwards}
@keyframes ko{to{transform:translateY(30px) rotate(25deg) scale(.6);opacity:0}}
.stage.quake{animation:shake .3s 2}
.shieldfx{position:absolute;inset:-12px;border-radius:50%;border:4px solid #4cc9f0;background:#4cc9f02e;box-shadow:0 0 18px #4cc9f0;opacity:0;transition:opacity .3s;pointer-events:none}
.shieldfx.on{opacity:1}
.combo{position:absolute;left:50%;top:112px;transform:translateX(-50%);font-weight:900;font-size:30px;color:#ffc93c;text-shadow:2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);z-index:4;white-space:nowrap}
.combo.bump{animation:spawn .26s}
.say{position:absolute;right:12%;top:104px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:900;z-index:5;opacity:0;transition:opacity .25s;max-width:60%}
.say.on{opacity:1}
.sbtns{position:absolute;right:10px;bottom:8px;display:flex;gap:6px;z-index:4}
.shot{position:absolute;width:40px;height:40px;z-index:5;pointer-events:none;transition:left .32s ease-in,top .32s ease-in}
.skills{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.skill{background:#fff}
.skill small{background:var(--blue);color:#fff;border-radius:6px;padding:0 5px;margin-left:6px;font-size:11px}
.skill.ready{background:var(--gold)}
.skill.locked{opacity:.4}
.opts .btn.gone{visibility:hidden}
.kh{font-weight:700;color:var(--purple);min-height:22px;font-size:15px}
.msgcard{max-width:560px;margin:4px auto 16px;text-align:left;background:#f1f3f5;border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.msgcard .mh{background:var(--ink);color:#fff;padding:6px 12px;font-size:14px}
.msgcard .mb{padding:14px;font-size:20px;font-weight:700;line-height:1.6}
.opts .btn.safe{background:#d8f3dc}.opts .btn.danger{background:#ffe0e6}
.starrow{font-size:44px;letter-spacing:6px;line-height:1}
.starrow span{color:#dee2e6;display:inline-block;-webkit-text-stroke:2px var(--ink)}
.starrow span.on{color:var(--gold);animation:spawn .35s both}
.rstat{font-size:15px;margin-top:6px}
.newbest{color:var(--red);font-weight:900;margin:4px 0}
.nst{display:block;font-size:12px;color:#e09f3e;letter-spacing:1px;line-height:1}
.hhead{display:inline-block;width:30px;height:30px;vertical-align:middle}
.heroes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.hpick{width:96px;border:3px solid var(--ink);border-radius:12px;background:#fff;cursor:pointer;padding:6px 4px;font:inherit;box-shadow:0 3px 0 var(--ink)}
.hpick .sv{width:80px;height:80px;margin:0 auto}
.hpick.sel{background:var(--gold);transform:translateY(-3px)}
@media (max-width:640px){.fighter{width:96px;height:96px}.fighter.enemy{width:110px;height:110px}.side{width:46%;font-size:12px}.stage{height:270px}.combo{top:96px;font-size:22px}}
.topbar{flex-wrap:wrap}
.daily{margin-top:12px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 14px}
.dq{display:grid;gap:6px;margin-top:8px}
.dqi{display:grid;grid-template-columns:1fr 130px 44px;gap:10px;align-items:center;font-weight:700}
.dqi .meter{width:100%}
.dqi small{text-align:right;color:#666}
.dqi.done span{color:#2d6a4f;text-decoration:line-through}
.ctabs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.ccard{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px;text-align:center;box-shadow:0 3px 0 var(--ink);min-height:120px;animation:spawn .25s}
.ccard.lock{background:#e9ecef;color:#999;display:flex;flex-direction:column;justify-content:center;box-shadow:none;border-style:dashed}
.ccard .cq{font-size:40px;font-weight:900}
.ccard .ct{font-weight:900;text-align:left;font-size:14px;line-height:1.5}
.ccard .ca{font-weight:900;color:var(--blue);margin:6px 0}
.ccard .ca.ok{color:#2d6a4f}.ccard .ca.bad{color:var(--red)}
.ccard .cm{font-size:13px;text-align:left;background:#f1f3f5;border-radius:8px;padding:4px 6px;margin:6px 0;line-height:1.5}
.ccard .cw{font-size:30px;font-weight:900;letter-spacing:3px;margin-top:10px}
.ccard .czy{color:var(--blue);font-weight:700;letter-spacing:2px}
.ccard small{color:#666;display:block;font-size:12px;line-height:1.5}
.towerbox{display:flex;gap:16px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:14px}
.towerart{width:130px;height:130px;flex:none;animation:bob 2.6s ease-in-out infinite}
.trules{margin:6px 0;padding-left:20px;line-height:1.8}
.cps{display:flex;flex-wrap:wrap;gap:10px}
@media (max-width:640px){.dqi{grid-template-columns:1fr 70px 36px;font-size:14px}.towerbox{flex-direction:column}}
.gchip{display:inline-block;margin-left:6px;background:var(--blue);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:900}
.grades{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.gpick{width:170px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;padding:12px 10px;font:inherit;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:4px}
.gpick .gnum{font-family:'Press Start 2P',monospace;font-size:34px;color:var(--blue);line-height:1.2}
.gpick b{font-size:20px}
.gpick small{color:#555;line-height:1.6;font-size:13px}
.gpick.sel{background:var(--gold);transform:translateY(-3px)}
/* 平板觸控 */
.arena,.mini-arena{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.bug{-webkit-touch-callout:none}
.ctable{overflow-x:auto;background:#fff;border:3px solid var(--ink);border-radius:12px}
.ctable table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
.ctable th{background:var(--gold);position:sticky;top:0;padding:6px 8px;border-bottom:2px solid var(--ink);text-align:left}
.ctable td{padding:5px 8px;border-bottom:1px solid #e9ecef}
.ctable tr.today td{background:#e6fff6}
.ctable tr.none td{color:#adb5bd}
/* 省電模式 */
.lowfx .eye,.lowfx .aura,.lowfx .spin,.lowfx .bob,.lowfx .float,.lowfx .drift,.lowfx .title .logo,.lowfx .fighter.enemy,.lowfx .bpet,.lowfx .dpet,.lowfx .keeper .kp,.lowfx .towerart,.lowfx .ccard{animation:none!important}
/* 新手教學 */
.tutor{display:flex;gap:10px;align-items:center;margin-top:10px;background:#fff3c4;border:3px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:15px;line-height:1.6}
.tutor .tarrow{font-size:30px;animation:bob 1s ease-in-out infinite}
.skills.glow .skill{box-shadow:0 0 0 4px #ffc93c,0 4px 0 var(--ink);animation:pulse 1.2s ease-in-out infinite}
/* 錯題本 */
.wrongbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ccard.wrong{border-color:var(--red)}
.ccard .wtag{font-size:12px;font-weight:900;color:var(--red);margin-bottom:4px}
.ccard.extra{border-style:dotted}
.ccard.extra .wtag{color:#e09f3e}
.wtab{border-color:var(--red)}
/* 螢幕比較矮時（例如教室筆電），縮小戰鬥舞台，讓敵人和題目可以同時看到 */
@media (max-height:820px){
 .stage{height:230px}.fighter{width:112px;height:112px;bottom:14px}.fighter.enemy{width:128px;height:128px}
 .side{font-size:12px;padding:4px 8px}.side .lab{margin-top:2px}.combo{top:78px;font-size:24px}.say{top:74px}
 #challenge{margin-top:8px;padding:10px 14px;min-height:0}.word{font-size:42px;margin:0 0 8px}.q{font-size:21px;margin:4px 0 10px}
 .zy{font-size:18px}input.tin{font-size:24px;padding:6px 12px}.skills{margin-top:6px}.tutor{font-size:13px;padding:6px 10px}
 #hud{margin-bottom:8px;padding:6px 12px;min-height:0}#main{padding:12px;min-height:0}
}
/* 村民、彩蛋、季節活動 */
.npc{position:absolute;transform:translate(-50%,-50%);width:48px;height:56px;border:none;background:none;padding:0;cursor:pointer;z-index:3}
.npc .sv{width:48px;height:48px;filter:drop-shadow(0 3px 0 #0004);transition:transform .15s}
.npc:hover .sv{transform:scale(1.15)}
.npc .bang{position:absolute;right:-6px;top:-8px;background:var(--gold);border:2px solid var(--ink);border-radius:50%;width:22px;height:22px;font-weight:900;font-size:14px;line-height:18px;animation:bob 1.2s ease-in-out infinite}
.npc.qdone .bang{background:var(--green);animation:none;font-size:11px}
.npc .nname{position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);background:#fffc;border:2px solid var(--ink);border-radius:8px;font-size:11px;font-weight:900;padding:0 5px;white-space:nowrap}
.egg{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border:none;background:none;padding:0;cursor:pointer;opacity:.42;z-index:2;transition:opacity .2s,transform .2s}
.egg:hover{opacity:1;transform:translate(-50%,-50%) scale(1.4)}
.egg .sv{width:30px;height:30px}
.evdecor{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.evdecor .snow{position:absolute;top:-10px;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 3px #fff;animation:snowfall linear infinite}
@keyframes snowfall{to{transform:translateY(560px) translateX(30px)}}
.evdecor .lantern{position:absolute;top:0;width:34px;height:52px;animation:swing 3s ease-in-out infinite;transform-origin:50% 0}
@keyframes swing{50%{transform:rotate(8deg)}}
.evdecor .pumpkin{position:absolute;width:52px;height:44px}
.evdecor .flypen{position:absolute;top:40%;font-size:26px;animation:floaty 4s ease-in-out infinite}
.evpanel{margin-top:12px;background:linear-gradient(90deg,#fff3c4,#ffe0e6);border:3px solid var(--ink);border-radius:12px;padding:10px 14px}
.evhead{display:flex;gap:12px;align-items:center}
.evitem{width:64px;height:64px;flex:none;background:#fff;border:2px solid var(--ink);border-radius:10px}
.lowfx .evdecor{display:none}
/* 成就 */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.ach{background:#f1f3f5;border:3px dashed #adb5bd;border-radius:12px;padding:10px;text-align:center;color:#999}
.ach.on{background:#fff;border:3px solid var(--ink);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.ach .aic{font-size:34px}.ach b{display:block}.ach small{font-size:12px}
/* 寵物等級 */
.bpet{transform-origin:50% 100%}
.plv{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);background:#fff;border:2px solid var(--ink);border-radius:8px;font-size:11px;font-weight:900;padding:0 5px}
.plv.glow{background:var(--gold);box-shadow:0 0 8px #ffc93c}
.ditem .pfx{color:var(--blue);font-weight:700}
/* 村民任務 */
.qhead{display:flex;gap:14px;align-items:center;margin:8px 0 12px}
.qnpc{width:110px;height:110px;flex:none;animation:bob 2.4s ease-in-out infinite}
/* AI 小偵探 */
.aipic{background:#fff;border-bottom:2px solid #dee2e6;display:flex;justify-content:center;padding:8px}
.aipic svg{width:240px;height:160px}
/* 程式遊樂園 */
.codewrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;--cell:62px}
.board{position:relative;display:grid;background:#d8f3dc;border:3px solid var(--ink);border-radius:12px;padding:0;overflow:hidden;flex:none}
.cell{width:var(--cell);height:var(--cell);border:1px dashed #95d5b2;display:flex;align-items:center;justify-content:center}
.cell .sv{width:70%;height:70%}
.cell.got .sv{opacity:0;transform:scale(1.6);transition:all .3s}
.cell.wall{background:repeating-linear-gradient(45deg,#6c757d 0 8px,#495057 8px 16px);border:1px solid #343a40}
.bot{position:absolute;left:0;top:0;width:var(--cell);height:var(--cell);transition:transform .32s ease-in-out;z-index:2;padding:6px}
.bot .sv{transition:transform .25s}
.cpanel{flex:1;min-width:260px}
.hint2{background:#fff3c4;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:700;margin:0 0 8px}
.prog{min-height:60px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.prog .empty{color:#adb5bd;font-size:14px}
.blk{border:2px solid var(--ink);border-radius:8px;padding:4px 8px;font-weight:900;font-size:14px;color:#fff}

let gen=0,timers=[],keyHandler=null;
function clearTimers(){timers.forEach(t=>{clearTimeout(t);clearInterval(t)});timers=[]}
function after(f,ms){const g=gen;const t=setTimeout(()=>{if(g===gen)f()},ms);timers.push(t);return t}
function every(f,ms){const g=gen;const t=setInterval(()=>{if(g===gen)f()},ms);timers.push(t);return t}
let busy=false; // 戰鬥或計時小遊戲進行中（休息提醒會等到結束才跳出）

const TOUCH=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
const RIGHT=TOUCH?'長按':'右鍵';
function bindBug(el,t,hit,wrong){
 const H=()=>{if(!el.isConnected||el.dataset.dead)return;el.dataset.dead='1';hit()};
 if(t==='click'){el.onclick=H;el.oncontextmenu=e=>{e.preventDefault();if(!TOUCH)wrong('毛毛蟲要用「左鍵」點一下！')}}
 if(t==='dbl'){el.ondblclick=H;let last=0;el.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')return;const n=Date.now();if(n-last<450)H();last=n});
  el.oncontextmenu=e=>{e.preventDefault();if(!TOUCH)wrong('瓢蟲要用「左鍵」快速點兩下！')}}
 if(t==='right'){el.oncontextmenu=e=>{e.preventDefault();H()};let tm=null;
  el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;clearTimeout(tm);tm=setTimeout(H,550)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(tm)));
  el.onclick=()=>{if(!el.dataset.dead)wrong(TOUCH?'外星蟲要「長按」不放喔！':'外星蟲要按滑鼠「右鍵」！')}}}

function confetti(){if(lowfx())return;const cols=['#ffc93c','#ef476f','#06d6a0','#118ab2','#9b5de5'];for(let i=0;i<70;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%5];c.style.animationDuration=2+Math.random()*1.6+'s';c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}}

/* ---------- 拖曳工具（滑鼠 / 觸控皆可） ---------- */
function makeDrag(el,onDrop){
 el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();
  const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,orig=el.style.cssText;
  el.dataset.drag='1';el.classList.add('dragging');
  Object.assign(el.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',zIndex:999,pointerEvents:'none',margin:0});
  const mv=ev=>{el.style.left=ev.clientX-ox+'px';el.style.top=ev.clientY-oy+'px'};
  // 放開滑鼠＝正常放下；pointercancel／視窗失焦＝拖曳被中斷，物品放回原位
  const end=(ev,cancel)=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',cc);window.removeEventListener('blur',cc);
   const t=cancel?null:document.elementFromPoint(ev.clientX,ev.clientY);el.style.cssText=orig;el.classList.remove('dragging');delete el.dataset.drag;onDrop(t,el)};
  const up=ev=>end(ev,false),cc=ev=>end(ev,true);
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',cc);window.addEventListener('blur',cc)})}

function zhuyinKeys(){
 const pool=Object.keys(ZY).filter(c=>!/[ˊˇˋ˙]/.test(ZY[c]));let time=30,score=0,miss=0,cur,hint=true,started=false;

 <div class="kb" id="kb">${KROWS.map(r=>`<div class="kr">${r.map(c=>`<div class="key" data-c="${c}"><b>${KLAB(c)}</b><span>${ZY[c]}</span></div>`).join('')}</div>`).join('')}</div>
 <div style="margin-top:10px"><button class="btn g" id="go">▶ 開始（30 秒）</button></div></div>`;
 const info=$('#info'),tg=$('#tg');const K=c=>main.querySelector(`.key[data-c="${c}"]`);
 $('#hint').onchange=e=>{hint=e.target.checked;mark()};
 const mark=()=>{main.querySelectorAll('.key.hl').forEach(k=>k.classList.remove('hl'));if(hint&&cur)K(cur).classList.add('hl')};
 const nextK=()=>{let n;do{n=pool[rnd(pool.length)]}while(n===cur);cur=n;tg.textContent=ZY[cur];mark()};
 const flash=(c,cl)=>{const k=K(c);if(!k)return;k.classList.add(cl);setTimeout(()=>k.classList.remove(cl),180)};
 $('#go').onclick=e=>{if(started)return;started=true;busy=true;e.target.remove();if(document.activeElement)document.activeElement.blur();nextK();info.textContent=`${time}s  ${score}分`;
  every(()=>{time--;info.textContent=`${time}s  ${score}分`;if(time<=0){clearTimers();keyHandler=null;reward(Math.min(40,score*2),Math.min(30,score),`答對 ${score} 個、按錯 ${miss} 次`,zhuyinKeys)}},1000);
  keyHandler=ev=>{if(ev.repeat||ev.ctrlKey||ev.metaKey||ev.altKey)return;if(!(ev.code in ZY))return;ev.preventDefault();
   if(ev.code===cur){score++;sfx.hit();flash(ev.code,'ok');nextK()}else{miss++;sfx.bad();flash(ev.code,'no')}info.textContent=`${time}s  ${score}分`}}}

 <ul class="trules"><li>機器人會<b>照順序</b>執行你排好的積木</li><li>撞到石頭或走出格子就要重來</li><li>積木用得越少，星星越多；學會「重複」就能用很少的積木走很遠！</li></ul></div></div>
 <div class="cps">${CODELV.map((L,i)=>{const open=i<=c.lv||TEACHER;return `<button class="btn ${open?'g':'alt'}" data-i="${i}" ${open?'':'disabled'}>${open?'':'🔒 '}第 ${i+1} 關 ${c.st[i]?starStr(c.st[i]):''}</button>`}).join('')}</div>`;
 $('#cmb').onclick=()=>go(mapScreen);main.querySelectorAll('.cps .btn').forEach(b=>b.onclick=()=>{sfx.click();go(()=>codeLevel(+b.dataset.i))})}
function codeLevel(i){const L=CODELV[i],H=L.g.length,W=L.g[0].length;let sr=0,sc=0;L.g.forEach((r,y)=>[...r].forEach((v,x)=>{if(v==='S'){sr=y;sc=x}}));
 let prog=[],repN=3,running=false;
 const count=a=>a.reduce((n,x)=>n+1+(x.t==='rep'?count(x.body):0),0);
 const target=()=>{let a=prog;while(a.length&&a[a.length-1].t==='rep'&&a[a.length-1].open)a=a[a.length-1].body;return a};
 const flat=a=>a.flatMap(x=>x.t==='rep'?[...Array(x.n)].flatMap(()=>flat(x.body)):[x.t]);
 const popLast=a=>{const l=a[a.length-1];if(!l)return;if(l.t==='rep'&&l.open&&l.body.length)return popLast(l.body);a.pop()};
 const NAME={f:'⬆ 前進',l:'↶ 左轉',r:'↷ 右轉'};
 const progHTML=a=>a.map(x=>x.t==='rep'?`<div class="blk rep ${x.open?'open':''}"><div class="rh">🔁 重複 ${x.n} 次${x.open?'<small>（放進來的積木會重複）</small>':''}</div><div class="inner">${progHTML(x.body)||'<span class="empty">把積木放進來</span>'}</div></div>`:`<div class="blk b${x.t}">${NAME[x.t]}</div>`).join('');
 main.innerHTML=`<div class="topbar"><button class="btn sm alt" id="clb">⬅ 關卡選擇</button><h2>🧩 第 ${i+1} 關</h2><div class="stat" id="cnt"></div></div>
 <div class="codewrap"><div class="board" id="bd" style="grid-template-columns:repeat(${W},var(--cell));grid-template-rows:repeat(${H},var(--cell))">
  ${L.g.map((r,y)=>[...r].map((v,x)=>`<div class="cell ${v==='#'?'wall':''}" data-g="${v==='G'?y+','+x:''}">${v==='G'?ch('gem'):''}</div>`).join('')).join('')}
  <div class="bot" id="bot">${ch('bot')}</div></div>
 <div class="cpanel"><p class="hint2">💡 ${L.hint}</p><div class="prog" id="prog"></div>
  <div class="pal"><button class="btn sm" data-a="f">⬆ 前進</button><button class="btn sm" data-a="l">↶ 左轉</button><button class="btn sm" data-a="r">↷ 右轉</button>
  <span class="repbox"><button class="btn sm" data-a="rep">🔁 重複</button><button class="btn sm alt" data-a="dec">−</button><b id="repn">3</b><button class="btn sm alt" data-a="inc">＋</button> 次</span>
  <button class="btn sm alt" data-a="end">✅ 結束重複</button><button class="btn sm alt" data-a="undo">⌫ 刪一個</button><button class="btn sm alt" data-a="clr">🗑 清空</button></div>
  <div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn g" id="run">▶ 執行</button><button class="btn alt" id="rst">↺ 機器人回原位</button></div></div></div>`;
 const bot=$('#bot'),place=(r,c,d)=>{bot.style.transform=`translate(${c*100}%,${r*100}%)`;bot.firstElementChild.style.transform=`rotate(${d*90}deg)`};
 const resetBoard=()=>{place(sr,sc,0);main.querySelectorAll('.cell[data-g]').forEach(c=>{if(c.dataset.g)c.classList.remove('got')})};
 const draw=()=>{$('#prog').innerHTML=progHTML(prog)||'<span class="empty">按下面的積木，排出你的程式</span>';$('#cnt').textContent=`積木 ${count(prog)} / ${L.max}`;$('#repn').textContent=repN};
 resetBoard();draw();$('#clb').onclick=()=>go(codeMenu);
 main.querySelectorAll('.pal .btn').forEach(b=>b.onclick=()=>{if(running)return;const a=b.dataset.a;sfx.click();
  if(a==='inc'||a==='dec'){repN=Math.max(2,Math.min(9,repN+(a==='inc'?1:-1)));draw();return}
  if(a==='undo'){popLast(prog);draw();return}if(a==='clr'){prog=[];draw();return}
  if(a==='end'){let arr=prog,last=null;while(arr.length&&arr[arr.length-1].t==='rep'&&arr[arr.length-1].open){last=arr[arr.length-1];arr=last.body}if(last)last.open=false;else toast('現在沒有打開的「重複」');draw();return}
  if(count(prog)>=L.max){sfx.bad();toast(`這一關最多只能用 ${L.max} 個積木！試試「🔁 重複」`,2400);return}
  target().push(a==='rep'?{t:'rep',n:repN,body:[],open:true}:{t:a});draw()});
 $('#rst').onclick=()=>{if(!running)resetBoard()};
 $('#run').onclick=()=>{if(running)return;const steps=flat(prog);if(!steps.length){toast('先排一些積木喔！');return}
  running=true;resetBoard();let r=sr,c=sc,d=0,k=0;const gems=new Set(L.g.flatMap((row,y)=>[...row].map((v,x)=>v==='G'?y+','+x:null).filter(Boolean)));const total=gems.size;
  const fail=msg=>{running=false;sfx.bad();fx($('#bd'),'shake',400);toast(msg,2600)};
  const step=()=>{if(k>=Math.min(steps.length,120)){running=false;
    if(!gems.size){const n=count(prog),stars=n<=L.par?3:n<=L.par+2?2:1;S.code=S.code||{lv:0,st:{}};const first=!S.code.st[i];
     S.code.st[i]=Math.max(S.code.st[i]||0,stars);if(i>=S.code.lv)S.code.lv=i+1;const cn=first?30:10,xp=first?20:8;S.coins+=cn;gainExp(xp);stAdd('codeWins');save();hud();sfx.win();confetti();
     logRec('程式遊樂園',`第 ${i+1} 關`,`${stars}星（用了 ${n} 個積木）`);
     showModal(`<div class="big" style="width:90px;height:90px;margin:0 auto">${ch('bot')}</div><h2>程式成功！</h2>${starRow(stars)}<p>用了 <b>${n}</b> 個積木（三星要 ${L.par} 個以內）<br>${COIN} +${cn}　⭐ +${xp}</p>`,
      [...(i+1<CODELV.length?[{t:'➡ 下一關',c:'g',f:()=>go(()=>codeLevel(i+1))}]:[]),{t:'↺ 再挑戰',c:'alt',f:()=>go(()=>codeLevel(i))},{t:'關卡選擇',c:'alt',f:()=>go(codeMenu)}])}
    else fail(`還有 ${gems.size} 顆寶石沒撿到（共 ${total} 顆），修改程式再試一次！`);return}
   const s=steps[k++];
   if(s==='l')d=(d+3)%4;else if(s==='r')d=(d+1)%4;else{const nr=r+DR[d],nc=c+DC[d];if(nr<0||nc<0||nr>=H||nc>=W||L.g[nr][nc]==='#'){place(r,c,d);return fail(nr<0||nc<0||nr>=H||nc>=W?'機器人走出格子了！檢查一下方向。':'撞到石頭了！檢查一下轉彎的地方。')}
    r=nr;c=nc;const key=r+','+c;if(gems.delete(key)){sfx.good();main.querySelector(`.cell[data-g="${key}"]`).classList.add('got')}}
   place(r,c,d);after(step,380)};
  after(step,200)}}

/* =========================================================
   ⌨️ 打字高塔：詞語從天上掉下來，在落地前打出來！
   ========================================================= */
function typeTower(){busy=true;const pool=G3()?[...WORDS.easy,...WORDS.mid]:[...WORDS.mid,...WORDS.hard],best=st().cpm||0;
 let hearts=3,score=0,chars=0,time=60,items=[],started=false,lastSpawn=0,t0=0;
 main.innerHTML=back(`${ic('kbd')} 打字高塔`)+`<div class="rainbox" id="rb"><div class="rhud"><span id="rh">❤️❤️❤️</span><span id="rs">0 個</span><span id="rt">60 秒</span></div><div class="rstart" id="rst2"><b>詞語會從天上掉下來！</b><br>在落地前用注音打出來，就會消失。<br>漏掉 3 個就結束。<br><span class="tip">最高紀錄：每分鐘 ${best} 字</span><br><button class="btn g" id="rgo">▶ 開始</button></div></div>
 <div class="center" style="margin-top:8px"><input class="tin" id="ri" autocomplete="off" placeholder="看到詞語就打出來！" disabled></div>`;
 const rb=$('#rb'),inp=$('#ri');
 const spawn=()=>{const [w,z]=pool[rnd(pool.length)];const el=document.createElement('div');el.className='rword';el.innerHTML=`<b>${w}</b><small>${z}</small>`;rb.appendChild(el);const x=8+rnd(70);el.style.left=x+'%';items.push({w,el,y:-40})};
 const end=()=>{if(!started)return;started=false;inp.disabled=true;clearTimers();const sec=Math.max(1,(Date.now()-t0)/1000),cpm=Math.round(chars/sec*60),nb=cpm>best;stMax('cpm',cpm);
  reward(Math.min(40,score*2),Math.min(30,score*2),`打對 ${score} 個詞，速度每分鐘 ${cpm} 字${nb?'（🎉 新紀錄！）':''}`,typeTower)};
 const hit=v=>{const it=items.filter(x=>x.w===v).sort((a,b)=>b.y-a.y)[0];if(!it)return false;items=items.filter(x=>x!==it);
  const r=it.el.getBoundingClientRect(),a=rb.getBoundingClientRect();burst(rb,r.left-a.left+r.width/2,r.top-a.top+20,8);it.el.remove();
  score++;chars+=v.length;stAdd('typeOK');codexAdd('w',ALLW.findIndex(x=>x[0]===v));sfx.good();$('#rs').textContent=score+' 個';return true};
 const norm=s=>s.replace(/[\s，,。.！!]/g,'');let comp=false;
 const check=()=>{if(!started)return;const v=norm(inp.value);if(v&&hit(v))inp.value=''};
 inp.addEventListener('compositionstart',()=>comp=true);inp.addEventListener('compositionend',()=>{comp=false;setTimeout(check,0)});
 inp.addEventListener('input',()=>{if(!comp)check()});inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!comp){check();if(inp.value){sfx.bad();inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),300);inp.value=''}}});
 $('#rgo').onclick=()=>{sfx.click();$('#rst2').remove();started=true;inp.disabled=false;inp.focus();t0=Date.now();lastSpawn=t0;spawn();
  every(()=>{time--;$('#rt').textContent=time+' 秒';if(time<=0)end()},1000);
  every(()=>{const el=(Date.now()-t0)/1000,H=rb.clientHeight-50,sp=(SLOW?.45:.7)*(1+el/45)*(G3()?.8:1),gap=Math.max(900,2400-el*25)*(SLOW?1.4:1);
   if(Date.now()-lastSpawn>gap){lastSpawn=Date.now();spawn()}
   items.forEach(it=>{it.y+=sp*2;it.el.style.top=it.y+'px'});
   const fell=items.filter(it=>it.y>H);fell.forEach(it=>{it.el.classList.add('miss');setTimeout(()=>it.el.remove(),300);hearts--;sfx.bad()});
   if(fell.length){items=items.filter(it=>it.y<=H);$('#rh').textContent='❤️'.repeat(Math.max(0,hearts))+'🖤'.repeat(3-Math.max(0,hearts));if(hearts<=0)end()}},40)}}

 return NPCS.map(n=>`<button class="npc ${qd.includes(n.id)?'qdone':''}" data-q="${n.id}" style="left:${n.x}%;top:${n.y}%" title="${n.n}">${doll(n.look)}<span class="bang">${qd.includes(n.id)?'✔':'!'}</span><span class="nname">${n.n}</span></button>`).join('')
