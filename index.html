<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電腦王國大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--ink:#22223b;--paper:#fffbea;--gold:#ffc93c;--red:#ef476f;--green:#06d6a0;--blue:#118ab2;--purple:#9b5de5;--sky:#caf0f8}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans TC',system-ui,sans-serif;background:#1d2145;background-image:radial-gradient(circle at 15% 0%,#3a4190 0,transparent 55%),radial-gradient(circle at 90% 100%,#4b2a6b 0,transparent 50%);color:var(--ink);min-height:100vh;user-select:none;-webkit-user-select:none}
#app{max-width:1000px;margin:0 auto;padding:12px}
.px{font-family:'Press Start 2P',monospace;font-size:11px}
#hud{display:flex;flex-wrap:wrap;gap:14px;align-items:center;background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:0 6px 0 #0007;margin-bottom:14px;min-height:56px}
#hud:empty{display:none}
.stat{display:flex;align-items:center;gap:6px;font-weight:900}
.meter{width:120px;height:14px;background:#e9e3cf;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--green);transition:width .3s}
.meter.exp>i{background:var(--gold)}
.meter.foehp{width:100%;height:20px}
.meter.foehp>i{background:var(--red)}
.meter.atk{width:100%;height:8px;border-width:2px}
.meter.atk>i{background:var(--purple);transition:none}
#main{position:relative;background:var(--paper);border:4px solid var(--ink);border-radius:18px;min-height:580px;padding:16px;box-shadow:0 8px 0 #0007;overflow:hidden}
h1,h2,h3{margin:.2em 0}
.btn{font:inherit;font-weight:900;font-size:18px;padding:10px 18px;border:3px solid var(--ink);border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .05s,filter .1s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sm{font-size:14px;padding:5px 10px;box-shadow:0 3px 0 var(--ink)}
.btn.alt{background:#fff}
.btn.g{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar h2{flex:1}
.center{text-align:center}
.tip{color:#666;font-size:14px;margin-top:8px}
input.tin{font:inherit;font-size:30px;font-weight:700;padding:10px 14px;border:4px solid var(--ink);border-radius:12px;width:min(460px,90%);text-align:center;background:#fff;outline:none;user-select:text;-webkit-user-select:text}
input.tin:focus{border-color:var(--blue);box-shadow:0 0 0 4px #118ab233}
input.tin.ok{border-color:var(--green);background:#e6fff6}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{50%{opacity:0}}
@keyframes lunge{0%,100%{transform:scale(1)}40%{transform:scale(1.5) translateY(20px)}}
@keyframes popup{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-50px)}}
@keyframes spawn{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes flashred{0%{box-shadow:inset 0 0 0 0 #ef476f00}30%{box-shadow:inset 0 0 0 14px #ef476faa}100%{box-shadow:inset 0 0 0 0 #ef476f00}}
.hurt{animation:flashred .4s}
/* title */
.title{text-align:center;padding:30px 10px}
.title .logo{font-size:90px;animation:bob 2s infinite}
.title h1{font-size:46px;font-weight:900;letter-spacing:4px;color:var(--ink);text-shadow:4px 4px 0 var(--gold)}
.title .sub{font-size:18px;color:#555;margin-bottom:24px}
/* map */
.map{position:relative;height:520px;border-radius:14px;border:3px solid var(--ink);overflow:hidden;background:
 radial-gradient(ellipse at 87% 22%,#6d2e2e 0 9%,transparent 10%),
 radial-gradient(ellipse at 16% 68%,#2d6a4f 0 13%,transparent 14%),
 linear-gradient(160deg,#b7e4c7,#74c69d 55%,#52b788)}
.river{position:absolute;left:-10%;top:48%;width:120%;height:46px;background:#48cae4;border-top:4px solid #90e0ef;border-bottom:4px solid #0096c7;transform:rotate(-8deg);opacity:.85}
.map svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;border:none;background:none;font:inherit;padding:0}
.node .ico{font-size:58px;display:block;filter:drop-shadow(0 5px 0 #0005);transition:transform .15s}
.node:hover .ico{transform:scale(1.15) translateY(-5px)}
.node .lbl{display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-weight:900;white-space:nowrap}
.node.locked .ico{filter:grayscale(1) brightness(.75) drop-shadow(0 5px 0 #0005)}
.node.done .lbl{background:var(--green)}
.node .tipx{display:none;position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:4px 10px;font-size:13px;white-space:nowrap;z-index:5}
.node:hover .tipx{display:block}
.hint{margin-top:12px;background:#fff;border:3px dashed var(--ink);border-radius:12px;padding:10px 14px;font-weight:700}
/* dialog */
.scene{height:540px;display:flex;align-items:center;justify-content:center;font-size:120px;border-radius:14px;border:3px solid var(--ink)}
.dlg{position:absolute;left:24px;right:24px;bottom:24px;background:#fff;border:4px solid var(--ink);border-radius:14px;padding:14px 16px 26px 100px;min-height:120px;cursor:pointer;z-index:50;box-shadow:0 6px 0 #0005}
.dlg .face{position:absolute;left:16px;top:12px;font-size:62px}
.dlg .who{font-weight:900;color:var(--blue)}
.dlg .txt{font-size:20px;line-height:1.6}
.dlg .nx{position:absolute;right:16px;bottom:6px;font-size:13px;color:#888;animation:blink 1s infinite}
/* battle */
.foe{display:flex;align-items:center;gap:16px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:10px 16px}
.foe .m{font-size:76px;line-height:1}
.foe .info{flex:1}
.foe.hit .m{animation:shake .3s}
.foe.atk .m{animation:lunge .45s}
#challenge{margin-top:14px;min-height:330px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:18px;text-align:center;position:relative}
.zy{font-size:22px;color:var(--blue);letter-spacing:3px;font-weight:700}
.word{font-size:58px;font-weight:900;letter-spacing:8px;margin:4px 0 14px}
.q{font-size:24px;font-weight:900;margin:6px 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:680px;margin:0 auto}
.opts .btn{background:#fff;font-size:19px}
.opts .btn.right{background:var(--green)}
.opts .btn.wrong{background:var(--red);color:#fff}
.expl{margin-top:14px;font-weight:700;color:var(--blue);min-height:26px}
.keycap{display:inline-block;border:3px solid var(--ink);border-bottom-width:6px;border-radius:8px;padding:4px 12px;background:#fff;font-weight:900;margin:0 3px}
.pop{position:absolute;font-weight:900;font-size:26px;color:var(--red);pointer-events:none;animation:popup .8s forwards;text-shadow:2px 2px 0 #fff;z-index:30;transform:translate(-50%,0)}
/* arena */
.arena{position:relative;height:400px;border:3px solid var(--ink);border-radius:14px;margin-top:12px;overflow:hidden;background:radial-gradient(circle at 30% 30%,#d8f3dc,#95d5b2 60%,#74c69d);cursor:crosshair}
.mini-arena{position:relative;height:260px;border:3px solid var(--ink);border-radius:12px;background:#d8f3dc;overflow:hidden}
.bug{position:absolute;font-size:46px;cursor:pointer;animation:spawn .2s;line-height:1;touch-action:none}
.bug:hover{transform:scale(1.15)}
.bug.gem{filter:drop-shadow(0 0 8px #fff)}
.bag{position:absolute;right:12px;bottom:12px;width:96px;height:96px;border:3px dashed var(--ink);border-radius:16px;background:#fff8;display:flex;align-items:center;justify-content:center;font-size:52px}
.legend{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.legend span{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:3px 10px;font-weight:700}
.dragging{opacity:.9;transform:scale(1.15);cursor:grabbing}
/* keyboard */
.kb{display:inline-block;margin-top:14px}
.kr{display:flex;gap:5px;margin-bottom:5px}
.kr:nth-child(2){margin-left:20px}.kr:nth-child(3){margin-left:34px}.kr:nth-child(4){margin-left:54px}
.key{width:50px;height:54px;border:2px solid var(--ink);border-bottom-width:5px;border-radius:8px;background:#fff;position:relative;transition:background .1s}
.key b{position:absolute;left:5px;top:2px;font-size:11px;color:#888}
.key span{position:absolute;right:6px;bottom:3px;font-size:22px;font-weight:900}
.key.hl{background:var(--gold)}
.key.ok{background:var(--green)}
.key.no{background:var(--red)}
.target{font-size:110px;font-weight:900;color:var(--blue);line-height:1.1}
/* arcade */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.gcard{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .1s}
.gcard:hover{transform:translateY(-4px)}
.gcard .e{font-size:50px}
.gcard h3{font-size:20px}
.gcard p{margin:4px 0;color:#555;font-size:14px}
.folders{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.folder{border:3px solid var(--ink);border-radius:14px;background:#ffe8a3;min-height:130px;text-align:center;padding:8px;transition:transform .1s}
.folder .fi{font-size:44px}
.folder .fn{font-weight:900}
.folder .cnt{font-size:13px;color:#555}
.folder.flash{background:var(--green)}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:100px;border:3px dashed #aaa;border-radius:14px;padding:12px;background:#fff}
.file{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:8px 10px;text-align:center;cursor:grab;width:110px;touch-action:none}
.file .fe{font-size:30px}
.file .nm{font-weight:700;font-size:15px;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:620px;margin:10px auto}
.mc{height:100px;border:3px solid var(--ink);border-radius:12px;background:var(--blue);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#fff;box-shadow:0 4px 0 var(--ink)}
.mc.up{background:#fff;color:var(--ink)}
.mc.up.txt{font-size:24px}
.mc.got{background:var(--green);cursor:default}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.item{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px;text-align:center}
.item .e{font-size:54px}
/* modal & toast */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal{background:var(--paper);border:4px solid var(--ink);border-radius:18px;padding:22px 26px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 0 #0008;animation:spawn .2s}
.modal .big{font-size:70px}
.modal p{font-size:17px;line-height:1.6}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;font-weight:700;padding:8px 16px;border-radius:12px;animation:spawn .15s}
.cert{border:10px double var(--gold);border-radius:16px;padding:30px;background:#fff;text-align:center;max-width:640px;margin:10px auto}
.cert h1{font-size:40px;letter-spacing:6px}
.cheat{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;font-size:14px}
.cheat span{background:#f1f1f1;border-radius:8px;padding:3px 8px}
@media (max-width:640px){.opts{grid-template-columns:1fr}.word{font-size:40px}.folders{grid-template-columns:repeat(2,1fr)}.key{width:30px;height:40px}.key span{font-size:15px}.title h1{font-size:32px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="main"></div>
</div>
<div id="toast"></div>
<script>
/* =========================================================
   電腦王國大冒險 — 滑鼠 × 注音 × 電腦知識 RPG
   ========================================================= */
const $=s=>document.querySelector(s);
const main=$('#main');
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- 遊戲資料 ---------- */
const WORDS={
 easy:[['電腦','ㄉㄧㄢˋ ㄋㄠˇ'],['滑鼠','ㄏㄨㄚˊ ㄕㄨˇ'],['鍵盤','ㄐㄧㄢˋ ㄆㄢˊ'],['螢幕','ㄧㄥˊ ㄇㄨˋ'],['網路','ㄨㄤˇ ㄌㄨˋ'],['開機','ㄎㄞ ㄐㄧ'],['關機','ㄍㄨㄢ ㄐㄧ'],['喇叭','ㄌㄚˇ ㄅㄚ'],['耳機','ㄦˇ ㄐㄧ'],['檔案','ㄉㄤˇ ㄢˋ']],
 mid:[['資料夾','ㄗ ㄌㄧㄠˋ ㄐㄧㄚˊ'],['印表機','ㄧㄣˋ ㄅㄧㄠˇ ㄐㄧ'],['隨身碟','ㄙㄨㄟˊ ㄕㄣ ㄉㄧㄝˊ'],['瀏覽器','ㄌㄧㄡˊ ㄌㄢˇ ㄑㄧˋ'],['密碼','ㄇㄧˋ ㄇㄚˇ'],['病毒','ㄅㄧㄥˋ ㄉㄨˊ'],['下載','ㄒㄧㄚˋ ㄗㄞˇ'],['儲存','ㄔㄨˇ ㄘㄨㄣˊ'],['複製','ㄈㄨˋ ㄓˋ'],['貼上','ㄊㄧㄝ ㄕㄤˋ']],
 hard:[['我會用滑鼠','ㄨㄛˇ ㄏㄨㄟˋ ㄩㄥˋ ㄏㄨㄚˊ ㄕㄨˇ'],['密碼不能告訴別人','ㄇㄧˋ ㄇㄚˇ ㄅㄨˋ ㄋㄥˊ ㄍㄠˋ ㄙㄨˋ ㄅㄧㄝˊ ㄖㄣˊ'],['上網要注意安全','ㄕㄤˋ ㄨㄤˇ ㄧㄠˋ ㄓㄨˋ ㄧˋ ㄢ ㄑㄩㄢˊ'],['記得常常存檔','ㄐㄧˋ ˙ㄉㄜ ㄔㄤˊ ㄔㄤˊ ㄘㄨㄣˊ ㄉㄤˇ'],['電腦王國萬歲','ㄉㄧㄢˋ ㄋㄠˇ ㄨㄤˊ ㄍㄨㄛˊ ㄨㄢˋ ㄙㄨㄟˋ']]
};
const WDMG={easy:14,mid:18,hard:30};
const QUIZ=[
 {q:'電腦裡負責「思考、運算」的大腦是哪一個？',a:['CPU 中央處理器','螢幕','喇叭','滑鼠墊'],e:'CPU 就像電腦的大腦，負責計算和下命令。'},
 {q:'關機或關掉程式之前，最重要的是先做什麼？',a:['儲存檔案','拔掉插頭','用力拍螢幕','什麼都不用做'],e:'先存檔，辛苦做的作業才不會不見！'},
 {q:'下面哪一個是「輸入裝置」？',a:['鍵盤','螢幕','喇叭','印表機'],e:'鍵盤、滑鼠、麥克風是把資料「送進」電腦的輸入裝置。'},
 {q:'下面哪一個是「輸出裝置」？',a:['印表機','滑鼠','鍵盤','麥克風'],e:'螢幕、喇叭、印表機把結果「送出來」給我們。'},
 {q:'「貓咪.jpg」是哪一種檔案？',a:['圖片','音樂','影片','文字文件'],e:'.jpg、.png、.gif 都是圖片檔。'},
 {q:'「兒歌.mp3」是哪一種檔案？',a:['音樂','圖片','影片','簡報'],e:'.mp3、.wav 是聲音、音樂檔。'},
 {q:'「校慶.mp4」是哪一種檔案？',a:['影片','音樂','圖片','文字文件'],e:'.mp4、.mov 是影片檔。'},
 {q:'哪一個密碼最安全？',a:['Tiger#2026sun','123456','自己的生日','password'],e:'好密碼要夠長，混合大小寫英文、數字和符號。'},
 {q:'網路上的陌生人問你家住哪裡，你應該？',a:['不回答，並告訴爸媽或老師','馬上告訴他','傳照片給他','約他見面'],e:'個人資料要保護好，遇到怪怪的事情一定要告訴大人。'},
 {q:'收到一個奇怪的連結說「點我送你一百萬」，你應該？',a:['不要點，問大人','馬上點開','分享給全班','輸入密碼領獎'],e:'這很可能是詐騙或病毒，千萬不要點！'},
 {q:'「資源回收筒」的功用是什麼？',a:['暫放刪除的檔案，還可以還原','讓電腦跑更快','放音樂','充電'],e:'刪掉的檔案會先到資源回收筒，後悔還能救回來。'},
 {q:'「資料夾」最主要的用途是？',a:['分類整理檔案','讓螢幕變亮','上網','打字'],e:'把檔案分類放進資料夾，找起來又快又方便。'},
 {q:'硬碟（或 SSD）主要是用來做什麼？',a:['長期儲存檔案','顯示畫面','播放聲音','移動游標'],e:'硬碟就像電腦的倉庫，關機後資料也還在。'},
 {q:'記憶體（RAM）主要是用來做什麼？',a:['暫時放「正在使用」的資料','永久收藏照片','印出作業','連上網路'],e:'RAM 像工作桌，關機後上面的東西就清空了。'},
 {q:'長時間使用電腦，應該怎麼做？',a:['每 30 分鐘休息，看看遠方','一直看不要眨眼','把螢幕拉到眼前','關燈玩比較酷'],e:'讓眼睛休息、坐姿端正，才能健康使用電腦。'},
 {q:'網路上看到的消息，一定都是對的嗎？',a:['不一定，要查證','一定是真的','只要很多人轉就是真的','有圖就是真的'],e:'網路上也有假消息，要多方查證喔。'},
 {q:'按住 Shift 再按英文字母，會打出？',a:['大寫字母','數字','注音','空白'],e:'Shift + 字母 = 大寫字母。'},
 {q:'網址開頭的「https」中的 s 代表什麼？',a:['連線有加密，比較安全','速度很慢','網站很小','要付錢'],e:'s 是 Secure（安全），代表資料傳送有加密。'},
 {q:'在 Windows 裡，切換「中文/英文」輸入常用哪個鍵？',a:['Shift','Delete','Esc','F5'],e:'微軟注音輸入法按一下 Shift 就能切換中英文。'},
 {q:'USB 隨身碟可以用來？',a:['帶著檔案到別台電腦','讓螢幕變大','當滑鼠用','煮飯'],e:'隨身碟小小一支，可以存檔案帶著走。'}
];

function makeDrag(el,onDrop){
 el.addEventListener('pointerdown',e=>{if(e.button!==0)return;e.preventDefault();
  const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,orig=el.style.cssText;
  el.dataset.drag='1';el.classList.add('dragging');
  Object.assign(el.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',zIndex:999,pointerEvents:'none',margin:0});
  const mv=ev=>{el.style.left=ev.clientX-ox+'px';el.style.top=ev.clientY-oy+'px'};
  const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
   const t=document.elementFromPoint(ev.clientX,ev.clientY);el.style.cssText=orig;el.classList.remove('dragging');delete el.dataset.drag;onDrop(t,el)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)})}

function forestBattle(){

 main.innerHTML=`<div class="foe" id="foe"><div class="m">🪲</div><div class="info"><b>蟲蟲大王</b> <span class="px" id="bhpt">100/100</span><div class="meter foehp"><i id="bhp" style="width:100%"></i></div></div><div class="center"><div class="px">TIME</div><div class="px" id="tm" style="font-size:22px;margin-top:6px">60</div></div></div>

 const ar=$('#arena');ar.oncontextmenu=e=>e.preventDefault();
 const hitBoss=(el,d)=>{if(over)return;const r=el.getBoundingClientRect(),a=ar.getBoundingClientRect();pop(ar,r.left-a.left+20,r.top-a.top,'-'+d);el.remove();alive--;sfx.hit();bhp=Math.max(0,bhp-d);
  $('#bhp').style.width=bhp+'%';$('#bhpt').textContent=bhp+'/100';const f=$('#foe');f.classList.remove('hit');void f.offsetWidth;f.classList.add('hit');
  if(bhp<=0){over=true;clearTimers();after(()=>winArea('mouse'),400)}};
 const wrong=(el,msg)=>{if(over)return;sfx.bad();toast(msg);el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),350);damage(3)};
 const spawn=()=>{if(over||alive>=6)return;const w=ar.clientWidth,h=ar.clientHeight;let x,y;do{x=rnd(w-60);y=rnd(h-60)}while(x>w-140&&y>h-140);
  const r=Math.random(),t=r<.4?'click':r<.65?'dbl':r<.9?'right':'gem';
  const el=document.createElement('div');el.className='bug'+(t==='gem'?' gem':'');el.textContent={click:'🐛',dbl:'🐞',right:'👾',gem:'💎'}[t];el.style.left=x+'px';el.style.top=y+'px';ar.appendChild(el);alive++;
  if(t==='click'){el.onclick=()=>hitBoss(el,5);el.oncontextmenu=e=>{e.preventDefault();wrong(el,'🐛 要用「左鍵」點一下！')}}
  if(t==='dbl'){el.ondblclick=()=>hitBoss(el,7);el.oncontextmenu=e=>{e.preventDefault();wrong(el,'🐞 要用「左鍵」快速點兩下！')}}
  if(t==='right'){el.oncontextmenu=e=>{e.preventDefault();hitBoss(el,7)};el.onclick=()=>wrong(el,'👾 要按滑鼠「右鍵」！')}
  if(t==='gem'){makeDrag(el,(target)=>{if(target&&target.closest('#bag')){ar.appendChild(el);hitBoss(el,12);toast('💎 拖曳成功！大傷害！')}else if(el.dataset.exp&&el.isConnected){el.remove();alive--}})}
  after(()=>{if(!el.isConnected)return;if(el.dataset.drag)el.dataset.exp='1';else{el.remove();alive--}},t==='gem'?5500:2700)};
 every(spawn,800);spawn();
 every(()=>{time--;$('#tm').textContent=time;if(time<=0&&!over){over=true;clearTimers();sfx.bad();logRec('滑鼠森林','時間到',`蟲蟲大王剩 ${bhp} HP`);showModal(`<div class="big">⏰</div><h2>時間到！</h2><p>蟲蟲大王還剩 ${bhp} HP，再練習一次就能打敗牠！</p>`,[{t:'再挑戰',c:'g',f:()=>go(forestBattle)},{t:'回地圖',c:'alt',f:()=>go(mapScreen)}])}},1000)}

/* ---------- 各種挑戰 ---------- */
let lastWord='';
function pickWord(level){let w;do{w=WORDS[level][rnd(WORDS[level].length)]}while(w[0]===lastWord&&WORDS[level].length>1);lastWord=w[0];return {w:w[0],z:w[1],d:WDMG[level]}}
function runTyping(w,ch,done){let fin=false,comp=false;
 ch.innerHTML=`<div style="font-weight:700;color:#666">⌨️ 用注音輸入法打出這個${w.w.length>3?'句子':'詞'}：</div><div class="zy">${w.z}</div><div class="word">${w.w}</div>
 <input class="tin" id="ti" autocomplete="off" placeholder="在這裡打字…"><div style="margin-top:12px"><button class="btn sm alt" id="skip">跳過（會被打）</button></div>
 <div class="tip">打對會自動攻擊！選字：按空白鍵或數字鍵　｜　切換中英：Shift</div>`;
 const inp=ch.querySelector('#ti');setTimeout(()=>inp.focus(),30);
 const norm=s=>s.replace(/[\s，,。.！!]/g,'');
 const check=enter=>{if(fin)return;const v=norm(inp.value);
  if(v===w.w){fin=true;inp.classList.add('ok');inp.blur();done(true,w.d)}
  else if(enter&&v.length){sfx.bad();toast('有字打錯囉，再檢查一下！');inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400);damage(3)}};
 inp.addEventListener('compositionstart',()=>comp=true);
 inp.addEventListener('compositionend',()=>{comp=false;setTimeout(()=>check(false),0)});
 inp.addEventListener('input',()=>{if(!comp)check(false)});
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing&&!comp)check(true)});
 ch.querySelector('#skip').onclick=()=>{if(fin)return;fin=true;done(false)}}
let quizBag=[];
function pickQuiz(){if(!quizBag.length)quizBag=shuffle(QUIZ);return quizBag.pop()}
function runQuiz(q,ch,done,dmg=20){let fin=false;const opts=shuffle(q.a);
 ch.innerHTML=`<div style="font-weight:700;color:#666">❓ 電腦知識問答</div><div class="q">${q.q}</div><div class="opts">${opts.map((o,i)=>`<button class="btn" data-i="${i}">${o}</button>`).join('')}</div><div class="expl" id="ex"></div>`;
 ch.querySelectorAll('.opts .btn').forEach(b=>b.onclick=()=>{if(fin)return;fin=true;const ok=opts[b.dataset.i]===q.a[0];
  ch.querySelectorAll('.opts .btn').forEach(x=>{if(opts[x.dataset.i]===q.a[0])x.classList.add('right')});if(!ok)b.classList.add('wrong');
  ch.querySelector('#ex').textContent=(ok?'⭕ 答對了！':'❌ 答錯了！')+q.e;after(()=>done(ok,dmg),1600)})}
function runShortcut(s,ch,done,dmg=25){let fin=false;const end=ok=>{if(fin)return;fin=true;keyHandler=null;ch.querySelector('#sr').textContent=ok?'⭕ 正確！':`❌ 答案是 Ctrl + ${s.k}`;after(()=>done(ok,dmg),900)};
 const mac=/Mac/.test(navigator.platform);
 ch.innerHTML=`<div style="font-weight:700;color:#666">⚡ 快捷鍵挑戰（真的按按看！）</div><div class="q" style="font-size:30px">請按下「${s.n}」的快捷鍵</div>
 <div style="font-size:40px;margin:10px"><span class="keycap">${mac?'⌘ / Ctrl':'Ctrl'}</span> + <span class="keycap" id="hk">？</span></div>
 <div class="expl" id="sr">按住 Ctrl 不放，再按一個英文字母</div><div class="tip">10 秒內作答，5 秒後會出現提示</div>`;
 after(()=>{if(!fin)ch.querySelector('#hk').textContent=s.k},5000);after(()=>end(false),10000);
 if(document.activeElement)document.activeElement.blur();
 keyHandler=e=>{if(!(e.ctrlKey||e.metaKey))return;if(!e.code.startsWith('Key'))return;e.preventDefault();end(e.code==='Key'+s.k)}}
function runClick(ch,done,dmg=25){let fin=false,left=5;
 ch.innerHTML=`<div style="font-weight:700;color:#666">🖱️ 7 秒內清光所有蟲蟲！ 🐛點一下　🐞點兩下　👾右鍵</div><div class="mini-arena" id="ma"></div>`;
 const ma=ch.querySelector('#ma');ma.oncontextmenu=e=>e.preventDefault();
 const kill=el=>{if(fin)return;el.remove();sfx.hit();left--;if(!left){fin=true;done(true,dmg)}};
 for(let i=0;i<5;i++){const t=['click','dbl','right'][rnd(3)],el=document.createElement('div');el.className='bug';el.textContent={click:'🐛',dbl:'🐞',right:'👾'}[t];
  el.style.left=3+rnd(80)+'%';el.style.top=10+rnd(70)+'%';ma.appendChild(el);
  if(t==='click')el.onclick=()=>kill(el);if(t==='dbl')el.ondblclick=()=>kill(el);if(t==='right')el.oncontextmenu=e=>{e.preventDefault();kill(el)}}
 after(()=>{if(!fin){fin=true;toast('時間到！');done(false)}},7000)}

/* --- 檔案分類大師 --- */
function fileSort(){
 const ALL=[['貓咪.jpg','pic'],['風景.png','pic'],['小狗.gif','pic'],['全家福.jpeg','pic'],['兒歌.mp3','mus'],['鋼琴.wav','mus'],['鳥叫聲.mp3','mus'],['校慶.mp4','vid'],['煙火.mov','vid'],['跳舞.mp4','vid'],['作業.docx','doc'],['日記.txt','doc'],['報告.pdf','doc'],['成績.xlsx','doc']];
 const files=shuffle(ALL).slice(0,10);let left=files.length,miss=0;const t0=Date.now();
 main.innerHTML=back('🗂️ 檔案分類大師')+`<p>看檔名後面的 <b>副檔名</b>（點後面的字），把檔案<b>按住拖曳</b>到正確的資料夾！</p><div class="tray" id="tray"></div>
 <div class="folders">${[['pic','🖼️','圖片','.jpg .png .gif'],['mus','🎵','音樂','.mp3 .wav'],['vid','🎬','影片','.mp4 .mov'],['doc','📄','文件','.docx .txt .pdf .xlsx']].map(f=>`<div class="folder" data-k="${f[0]}"><div class="fi">📁${f[1]}</div><div class="fn">${f[2]}</div><div class="cnt">0 個檔案</div></div>`).join('')}</div>`;
 const tray=$('#tray');const cnt={};
 files.forEach(([nm,k])=>{const el=document.createElement('div');el.className='file';el.innerHTML=`<div class="fe">📄</div><div class="nm">${nm}</div>`;tray.appendChild(el);
  makeDrag(el,target=>{const f=target&&target.closest('.folder');if(!f)return;
   if(f.dataset.k===k){el.remove();left--;cnt[k]=(cnt[k]||0)+1;f.querySelector('.cnt').textContent=cnt[k]+' 個檔案';f.classList.add('flash');setTimeout(()=>f.classList.remove('flash'),250);sfx.good();
    if(!left){const sec=Math.round((Date.now()-t0)/1000);reward(Math.max(8,30-miss*3),15,`用了 ${sec} 秒，放錯 ${miss} 次`,fileSort)}}
   else{miss++;sfx.bad();toast('放錯資料夾囉！再看看副檔名');f.classList.add('shake');setTimeout(()=>f.classList.remove('shake'),350)}})})}

/* --- 注音鍵盤反應王 --- */
function zhuyinKeys(){
 const pool=Object.keys(ZY).filter(c=>!/[ˊˇˋ˙]/.test(ZY[c]));let time=30,score=0,miss=0,cur,hint=true,started=false;
 main.innerHTML=back('⌨️ 注音鍵盤反應王')+`<div class="center"><p>看到注音符號，就按下鍵盤上對應的鍵（大千式注音鍵盤）。<b>不用切換輸入法</b>，直接按就可以！</p>
 <div class="target" id="tg">準備</div><div><label style="font-weight:700"><input type="checkbox" id="hint" checked> 顯示提示（黃色鍵）</label></div>
 <div class="kb" id="kb">${KROWS.map(r=>`<div class="kr">${r.map(c=>`<div class="key" data-c="${c}"><b>${KLAB(c)}</b><span>${ZY[c]}</span></div>`).join('')}</div>`).join('')}</div>
 <div style="margin-top:10px"><button class="btn g" id="go">▶ 開始（30 秒）</button></div></div>`;
 const info=$('#info'),tg=$('#tg');const K=c=>main.querySelector(`.key[data-c="${c}"]`);
 $('#hint').onchange=e=>{hint=e.target.checked;mark()};
 const mark=()=>{main.querySelectorAll('.key.hl').forEach(k=>k.classList.remove('hl'));if(hint&&cur)K(cur).classList.add('hl')};
 const nextK=()=>{let n;do{n=pool[rnd(pool.length)]}while(n===cur);cur=n;tg.textContent=ZY[cur];mark()};
 const flash=(c,cl)=>{const k=K(c);if(!k)return;k.classList.add(cl);setTimeout(()=>k.classList.remove(cl),180)};
 $('#go').onclick=e=>{if(started)return;started=true;e.target.remove();if(document.activeElement)document.activeElement.blur();nextK();info.textContent=`${time}s  ${score}分`;
  every(()=>{time--;info.textContent=`${time}s  ${score}分`;if(time<=0){clearTimers();keyHandler=null;reward(Math.min(40,score*2),Math.min(30,score),`答對 ${score} 個、按錯 ${miss} 次`,zhuyinKeys)}},1000);
  keyHandler=ev=>{if(ev.repeat||ev.ctrlKey||ev.metaKey||ev.altKey)return;if(!(ev.code in ZY))return;ev.preventDefault();
   if(ev.code===cur){score++;sfx.hit();flash(ev.code,'ok');nextK()}else{miss++;sfx.bad();flash(ev.code,'no')}info.textContent=`${time}s  ${score}分`}}}

/* --- 快捷鍵忍者 --- */
function ninja(){let round=0,score=0;
 main.innerHTML=back('🥷 快捷鍵忍者')+`<div id="challenge"></div><div class="cheat">${SHORTCUTS.map(s=>`<span>Ctrl+${s.k}＝${s.n}</span>`).join('')}</div>`;
 const ch=$('#challenge'),info=$('#info');
 const nx=()=>{round++;info.textContent=`第${round}/10題 ${score}分`;runShortcut(SHORTCUTS[rnd(SHORTCUTS.length)],ch,ok=>{if(ok)score++;if(round>=10)reward(score*3,score*2,`10 題答對 ${score} 題`,ninja);else after(nx,200)})};nx()}

/* --- 電腦零件記憶翻牌 --- */
function memory(){
 const P=[['🖱️','滑鼠'],['⌨️','鍵盤'],['🖥️','螢幕'],['🖨️','印表機'],['🎧','耳機'],['🎤','麥克風']];
 const deck=shuffle(P.flatMap((p,i)=>[{k:i,v:p[0],t:0},{k:i,v:p[1],t:1}]));let open=[],moves=0,got=0,lock=false;
 main.innerHTML=back('🃏 電腦零件記憶翻牌')+`<p class="center">點牌翻開，把 <b>圖示</b> 和 <b>名稱</b> 配成一對！</p><div class="cards">${deck.map((c,i)=>`<div class="mc" data-i="${i}">?</div>`).join('')}</div>`;
 const info=$('#info');info.textContent='步數 0';
 main.querySelectorAll('.mc').forEach(el=>el.onclick=()=>{const c=deck[el.dataset.i];if(lock||el.classList.contains('up')||el.classList.contains('got'))return;sfx.click();
  el.classList.add('up');if(c.t)el.classList.add('txt');el.textContent=c.v;open.push(el);
  if(open.length===2){moves++;info.textContent='步數 '+moves;const [a,b]=open.map(x=>deck[x.dataset.i]);
   if(a.k===b.k){open.forEach(x=>{x.classList.add('got')});open=[];got++;sfx.good();if(got===P.length)after(()=>reward(Math.max(8,36-(moves-6)*2),15,`用了 ${moves} 步完成！`,memory),400)}
   else{lock=true;after(()=>{open.forEach(x=>{x.classList.remove('up','txt');x.textContent='?'});open=[];lock=false},800)}}})}

/* ---------- 啟動 ---------- */
go(titleScreen);
</script>
</body>
</html>
